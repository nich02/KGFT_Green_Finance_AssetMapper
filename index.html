<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browser-based KGFT-informed portfolio screening demo. Uploaded CSV files are processed locally.">
  <title>Green Asset Mapping Dashboard</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
    iframe { display: block; min-height: 100vh; }
  </style>
</head>
<body>
  <iframe id="dashboard" src="KGFT_AssetMapper/dashboard_preview.html" title="Green Asset Mapping Dashboard"></iframe>
  <noscript>This dashboard requires JavaScript. CSV data you select is processed locally in your browser.</noscript>
  <script>
    const dashboardFrame = document.getElementById("dashboard");
    dashboardFrame.addEventListener("load", () => {
      const dashboard = dashboardFrame.contentWindow;
      if (!window.XLSX || typeof dashboard.exportCsv !== "function") return;

      dashboard.XLSX = window.XLSX;
      dashboard.exportCsv = () => {
        try {
          const assets = dashboard.eval("assets.map(asset => ({ ...asset }))");
          const sheets = [
            ["All assets", assets],
            ["Green identified", assets.filter(asset => asset.status === "green")],
            ["Manual assessment", assets.filter(asset => asset.status === "review")],
            ["Not green", assets.filter(asset => asset.status === "other")],
          ];
          const workbook = dashboard.XLSX.utils.book_new();
          for (const [name, rows] of sheets) {
            const cleanRows = rows.map(({ status, ...asset }) => asset);
            const worksheet = dashboard.XLSX.utils.json_to_sheet(cleanRows);
            dashboard.XLSX.utils.book_append_sheet(workbook, worksheet, name);
          }
          dashboard.XLSX.writeFile(workbook, "green_asset_mapping_register.xlsx");
        } catch (error) {
          const flash = dashboard.document.getElementById("flash");
          flash.textContent = `Workbook export failed: ${error.message}`;
          flash.className = "flash error";
        }
      };
    });
  </script>
</body>
</html>
